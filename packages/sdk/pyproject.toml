[project]
name = "cscode-sdk"
version = "0.2.10"
description = "CScode SDK - Programmatic access to CScode AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cscode_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
