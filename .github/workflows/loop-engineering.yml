name: Loop Engineering Automation

on:
  # Daily scheduled - CI triage and maintenance
  schedule:
    - cron: '0 6 * * *'  # 6 AM daily
  # CI failure triggers repair loop
  workflow_run:
    workflows: ['Build Desktop App']
    types: [completed]
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
  # Manual trigger
  workflow_dispatch:
    inputs:
      loop_type:
        description: 'Loop type'
        required: true
        default: 'dev-loop'
        type: choice
        options:
          - dev-loop
          - bug-fix
          - ci-repair
          - build-package
      task:
        description: 'Task description'
        required: true

env:
  OPENCODE_MODEL: volcengine/deepseek-v4-pro
  MAX_COST: 15.0

jobs:
  run-loop:
    runs-on: macos-14
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest mypy ruff

      - name: Run Development Loop
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.loop_type == 'dev-loop'
        run: |
          opencode << 'EOF'
          Run the dev-loop to implement: ${{ github.event.inputs.task }}
          1. Explore codebase and requirements
          2. Write spec to openspec/specs/
          3. Implement with TDD
          4. Verify: pytest, mypy, ruff
          5. Update state file
          Track iterations in .opencode/loop-state/
          EOF

      - name: Run Bug Fix Loop
        if: github.event_name == 'workflow_run'
        run: |
          opencode << 'EOF'
          Run the bug-fix loop:
          1. Analyze CI failure from previous run
          2. Create isolated worktree: git worktree add ../cscode-loop-${{ github.run_id }} -b loop/${{ github.run_id }}
          3. Identify root cause
          4. Write failing test first (TDD)
          5. Fix the bug
          6. Run full test suite: pytest tests/ && mypy src/ && ruff check src/
          7. Create PR with fix if all checks pass
          Track in .opencode/loop-state/ci-repair-${{ github.run_id }}.json
          EOF

      - name: Run Manual Loop
        if: github.event_name == 'workflow_dispatch'
        run: |
          opencode << 'EOF'
          Run the ${{ github.event.inputs.loop_type }} loop: ${{ github.event.inputs.task }}
          - Follow rules in AGENTS.md
          - Track state in .opencode/loop-state/
          - Verify: pytest && mypy && ruff
          - Max iterations: 10
          - Cost limit: $15
          EOF

      - name: Update loop state
        if: always()
        run: |
          git config --local user.email "loop[bot]@cscode.dev"
          git config --local user.name "Loop Engineering Bot"
          git add .opencode/loop-state/
          git commit -m "Update loop state" || true
          git push || true

      - name: Create review issue
        if: always()
        run: |
          gh issue create \
            --title "Loop Engineering Report - $(date +%Y-%m-%d)" \
            --body "Loop completed. Check \`.opencode/loop-state/\` for details." \
            --label "agent-loop" \
            || echo "Issue creation skipped"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}