name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            pkg: deb
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            pkg: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
            pkg: msi

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/cscode/web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          which cargo && cargo --version

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WebView2 is built into Windows 10+; only WiX is needed for MSI bundling
          dotnet tool install --global wix --version 5.0.2 2>$null
          echo "WiX installed"
          # Verify Rust target
          rustup target list --installed | findstr x86_64-pc-windows-msvc

      - name: Create and activate Python venv
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install -e .

      - name: Build React frontend
        working-directory: src/cscode/web
        run: |
          npm ci
          npx vite build

      - name: Create spinner page (Tauri frontendDist)
        shell: bash
        run: |
          mkdir -p desktop/dist
          # Restore spinner page for Tauri frontendDist
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>CScode</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;opacity:1;transition:opacity .2s ease}body.fade-out{opacity:0}.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#646cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="spinner"></div></body></html>' > desktop/dist/index.html

      - name: Bundle Python deps as site-packages.zip
        shell: bash
        run: |
          PYTHON="python3"
          if [ "$RUNNER_OS" = "Windows" ]; then PYTHON="python"; fi
          # Install ALL dependencies to a temp dir, then zip them using Python.
          # Using a zip avoids thousands of files in Tauri resources, which
          # crashes the build script on Windows (MAX_PATH / enumeration limits).
          TMPDIR=$(mktemp -d)
          $PYTHON -m pip install --target="$TMPDIR" . 2>&1 | tail -5
          # Remove playwright driver (not needed, huge)
          rm -rf "$TMPDIR/playwright/driver" 2>/dev/null || true
          # Remove __pycache__, tests, and bin
          find "$TMPDIR" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$TMPDIR/bin" 2>/dev/null || true
          # Create the zip using Python (cross-platform, unlike 'zip' command)
          mkdir -p desktop/src-tauri/resources
          $PYTHON -c "import zipfile,os,sys;from pathlib import Path;tmpdir=sys.argv[1];srcdir=Path(tmpdir);out=Path('desktop/src-tauri/resources/site-packages.zip');zf=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED);[zf.write(f,str(f.relative_to(srcdir))) for f in srcdir.rglob('*') if f.is_file() and not str(f.relative_to(srcdir)).startswith('cscode')];print(f'Created site-packages.zip with {len(zf.namelist())} entries')" "$TMPDIR" 2>&1
          rm -rf "$TMPDIR"
          echo "=== site-packages.zip size ==="
          ls -lh desktop/src-tauri/resources/site-packages.zip

      - name: Bundle cscode source + web/dist
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources/python
          # Copy only cscode source files (not pip deps) — ~100 files
          cd src
          for f in $(find cscode -path '*/web/dist' -prune -o -path '*/node_modules' -prune -o -type f -name '*.py' -print); do
            mkdir -p "../desktop/src-tauri/resources/python/$(dirname $f)"
            cp "$f" "../desktop/src-tauri/resources/python/$f"
          done
          # Copy web/dist for embedded serving
          mkdir -p ../desktop/src-tauri/resources/python/cscode/web
          cp -r cscode/web/dist ../desktop/src-tauri/resources/python/cscode/web/
          cd ..
          find desktop/src-tauri/resources/python -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== Source files bundled ==="
          find desktop/src-tauri/resources/python -type f | wc -l
          echo "=== Verify app.py ==="
          test -f desktop/src-tauri/resources/python/cscode/server/app.py && echo "OK" || echo "MISSING"
          echo "=== Verify web/dist ==="
          test -f desktop/src-tauri/resources/python/cscode/web/dist/index.html && echo "OK" || echo "MISSING"

      - name: Debug - check files
        shell: bash
        run: |
          echo "=== desktop/src-tauri/ dirs ==="
          ls -la desktop/src-tauri/
          echo "=== desktop/src-tauri/resources/ ==="
          ls -la desktop/src-tauri/resources/ 2>/dev/null || echo "no resources dir"
          echo "=== resources site-packages.zip ==="
          ls -lh desktop/src-tauri/resources/site-packages.zip 2>/dev/null || echo "no zip"
          echo "=== desktop/dist exists ==="
          test -f desktop/dist/index.html && echo "YES" || echo "NO"
          echo "=== resource file count ==="
          find desktop/src-tauri/resources -type f | wc -l

      - name: Install Tauri npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx tauri build --verbose --bundles app
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npx tauri build --verbose --bundles msi
          else
            npx tauri build --verbose
          fi

      - name: Debug bundle contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "=== bundle dir ==="
          if (Test-Path "desktop/src-tauri/target/release/bundle") {
            Get-ChildItem -Recurse "desktop/src-tauri/target/release/bundle"
          } else {
            echo "No bundle dir found"
          }
          echo "=== target/release ==="
          if (Test-Path "desktop/src-tauri/target/release") {
            Get-ChildItem "desktop/src-tauri/target/release" | Select-Object Name, Length
          }
          echo "=== .exe files ==="
          Get-ChildItem -Recurse "desktop/src-tauri/target" -Filter "*.exe" | Select-Object FullName, Length

      - name: Verify bundle resources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/CScode.app"
          echo "=== app bundle resources ==="
          ls -la "$APP_PATH/Contents/Resources/" 2>/dev/null || echo "No Resources dir"
          echo "=== site-packages.zip ==="
          ls -lh "$APP_PATH/Contents/Resources/resources/site-packages.zip" 2>/dev/null || echo "NO ZIP FOUND"
          echo "=== python src ==="
          test -f "$APP_PATH/Contents/Resources/resources/python/cscode/server/app.py" && echo "app.py OK" || echo "app.py MISSING"
          echo "=== web dist ==="
          test -f "$APP_PATH/Contents/Resources/resources/python/cscode/web/dist/index.html" && echo "web/dist OK" || echo "web/dist MISSING"

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/CScode.app"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"

          # Create DMG from the corrected .app
          STAGING="/tmp/cscode-dmg-$$"
          mkdir -p "$STAGING"
          cp -rf "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          VERSION=$(grep '"version"' desktop/src-tauri/tauri.conf.json | cut -d'"' -f4)
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "CScode" -srcfolder "$STAGING" -ov -format UDZO -imagekey zlib-level=9 "$DMG_DIR/CScode_${VERSION}_x64.dmg"
          rm -rf "$STAGING"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cscode-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/
          compression-level: 0

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List downloaded files
        run: |
          echo "=== Artifacts dir ==="
          find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.nsis
            artifacts/**/*.exe
            artifacts/**/*.app
          generate_release_notes: true
