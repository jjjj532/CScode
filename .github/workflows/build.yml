name: Build Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            pkg: deb
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            pkg: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
            pkg: msi

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/cscode/web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          which cargo && cargo --version

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WebView2 is built into Windows 10+; only WiX is needed for MSI bundling
          dotnet tool install --global wix --version 5.0.2 2>$null
          echo "WiX installed"
          # Verify Rust target
          rustup target list --installed | findstr x86_64-pc-windows-msvc
          # Add dotnet tools to GITHUB_PATH for subsequent bash steps
          $dotnetTools = "$env:USERPROFILE\.dotnet\tools"
          echo "Adding to PATH: $dotnetTools"
          echo "$dotnetTools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # Verify WiX is accessible
          & "$dotnetTools\wix.exe" --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WiX not in expected path, trying dotnet wix"
            dotnet wix --version 2>&1
          }

      - name: Create and activate Python venv
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install -e .

      - name: Build React frontend
        working-directory: src/cscode/web
        run: |
          npm ci
          npx vite build

      - name: Create spinner page (Tauri frontendDist)
        shell: bash
        run: |
          mkdir -p desktop/dist
          # Restore spinner page for Tauri frontendDist
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>CScode</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;opacity:1;transition:opacity .2s ease}body.fade-out{opacity:0}.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#646cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="spinner"></div></body></html>' > desktop/dist/index.html

      - name: Build PyInstaller backend
        shell: bash
        run: |
          PYTHON="python3"
          if [ "$RUNNER_OS" = "Windows" ]; then PYTHON="python"; fi
          $PYTHON -m pip install pyinstaller
          # Install cscode normally (non-editable) so PyInstaller finds it
          $PYTHON -m pip install . > /tmp/pip-install.log 2>&1 || { cat /tmp/pip-install.log; exit 1; }
          tail -3 /tmp/pip-install.log
          # Build with --onedir (fast startup, ~190MB)
          pyinstaller --onedir --name cscode-backend \
            --add-data "src/cscode/web/dist:web/dist" \
            desktop/backend-server.py --clean --noconfirm
          # Copy to Tauri resources
          mkdir -p desktop/src-tauri/resources
          cp -r dist/cscode-backend desktop/src-tauri/resources/
          echo "=== PyInstaller output ==="
          du -sh dist/cscode-backend/
          find dist/cscode-backend -type f | wc -l
          echo "files"
          echo "=== Verify binary ==="
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f desktop/src-tauri/resources/cscode-backend/cscode-backend.exe && echo "OK" || echo "MISSING"
          else
            test -f desktop/src-tauri/resources/cscode-backend/cscode-backend && echo "OK" || echo "MISSING"
          fi
          echo "=== Verify web/dist in binary ==="
          test -d dist/cscode-backend/_internal/web/dist && echo "OK" || echo "MISSING"

      - name: Debug - check files
        shell: bash
        run: |
          echo "=== desktop/src-tauri/resources/ ==="
          ls -la desktop/src-tauri/resources/ 2>/dev/null || echo "no resources dir"
          echo "=== resource file count ==="
          find desktop/src-tauri/resources -type f | wc -l
          echo "=== desktop/dist exists ==="
          test -f desktop/dist/index.html && echo "YES" || echo "NO"

      - name: Install Tauri npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_INCREMENTAL: 0
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_LOG=$(mktemp)
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx tauri build --verbose --bundles app
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # Pre-fetch crates to warm the cache (mitigates network timeouts)
            cargo fetch --manifest-path src-tauri/Cargo.toml 2>&1
            set +e
            # Retry up to 3 times for network resilience
            for attempt in 1 2 3; do
              cargo build --release --manifest-path src-tauri/Cargo.toml > /tmp/cargo.log 2>&1; rc1=$?
              if [ $rc1 -eq 0 ]; then break; fi
              if [ $attempt -lt 3 ]; then
                echo "::warning::cargo build attempt $attempt failed with $rc1, retrying..."
                sleep 10
              fi
            done
            set -e
            echo "::notice::CARGO_BUILD_EXIT_CODE=$rc1"
            head -50 /tmp/cargo.log
            if [ $rc1 -ne 0 ]; then exit $rc1; fi
            set +e
            for attempt in 1 2 3; do
              npx tauri build --verbose --bundles nsis > /tmp/tauri.log 2>&1; rc2=$?
              if [ $rc2 -eq 0 ]; then break; fi
              if [ $attempt -lt 3 ]; then
                echo "::warning::tauri build attempt $attempt failed with $rc2, retrying..."
                sleep 10
              fi
            done
            set -e
            echo "::notice::TAURI_BUILD_EXIT_CODE=$rc2"
            head -200 /tmp/tauri.log
            if [ $rc2 -ne 0 ]; then exit $rc2; fi
          else
            npx tauri build --verbose
          fi
          rm -f "$BUILD_LOG"

      - name: Debug build output (Windows)
        if: runner.os == 'Windows' && failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::=== Cargo build error (last 5 lines) ==="
          if [ -s /tmp/cargo.log ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              echo "::error::$line"
            done < <(tail -5 /tmp/cargo.log)
          fi
          echo "::notice::=== Creating GitHub issue ==="
          if [ -s /tmp/cargo.log ]; then
            { echo "## Windows cargo build failure"; echo; head -200 /tmp/cargo.log; } > /tmp/body.md
            gh issue create --title "Windows cargo build failure" --body-file /tmp/body.md --repo ${{ github.repository }} 2>&1 && echo "::notice::Issue created" || echo "::error::gh issue create failed exit=$?"
          fi

      - name: Debug bundle contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "=== bundle dir ==="
          if (Test-Path "desktop/src-tauri/target/release/bundle") {
            Get-ChildItem -Recurse "desktop/src-tauri/target/release/bundle"
          } else {
            echo "No bundle dir found"
          }
          echo "=== target/release ==="
          if (Test-Path "desktop/src-tauri/target/release") {
            Get-ChildItem "desktop/src-tauri/target/release" | Select-Object Name, Length
          }
          echo "=== .exe files ==="
          Get-ChildItem -Recurse "desktop/src-tauri/target" -Filter "*.exe" | Select-Object FullName, Length

      - name: Verify bundle resources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/CScode.app"
          echo "=== app bundle resources ==="
          ls -la "$APP_PATH/Contents/Resources/" 2>/dev/null || echo "No Resources dir"
          echo "=== site-packages.zip ==="
          ls -lh "$APP_PATH/Contents/Resources/resources/site-packages.zip" 2>/dev/null || echo "NO ZIP FOUND"
          echo "=== python src ==="
          test -f "$APP_PATH/Contents/Resources/resources/python/cscode/server/app.py" && echo "app.py OK" || echo "app.py MISSING"
          echo "=== web dist ==="
          test -f "$APP_PATH/Contents/Resources/resources/python/cscode/web/dist/index.html" && echo "web/dist OK" || echo "web/dist MISSING"

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/CScode.app"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"

          # Create DMG from the corrected .app
          STAGING="/tmp/cscode-dmg-$$"
          mkdir -p "$STAGING"
          cp -rf "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          VERSION=$(grep '"version"' desktop/src-tauri/tauri.conf.json | cut -d'"' -f4)
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "CScode" -srcfolder "$STAGING" -ov -format UDZO -imagekey zlib-level=9 "$DMG_DIR/CScode_${VERSION}_x64.dmg"
          rm -rf "$STAGING"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cscode-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/
          compression-level: 0

  create-release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List downloaded files
        run: |
          echo "=== Artifacts dir ==="
          find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.nsis
            artifacts/**/*.exe
            artifacts/**/*.app
          generate_release_notes: true
