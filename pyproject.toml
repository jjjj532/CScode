[project]
name = "cscode"
version = "0.3.3"
description = "CScode - AI-powered coding assistant (Python implementation)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "textual>=0.52.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.12",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "playwright>=1.60.0",
]

[project.scripts]
cs = "cscode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cscode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
#filterwarnings = ["ignore:Event loop is closed:pytest.PytestUnhandledThreadExceptionWarning"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--ignore=tests/test_race_conditions.py -W ignore::pytest.PytestUnhandledThreadExceptionWarning"

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["cscode"]

[project.optional-dependencies]
desktop = [
    # keyring: store API keys in the system keychain (macOS/Windows).
    # Packaged into the desktop DMG; not a runtime requirement for CLI/dev,
    # so kept out of core `dependencies` to avoid Linux dbus/SecretService needs.
    "keyring>=24.0.0",
]
test = [
    "respx>=0.23.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
